<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beacon 灯塔 · 管理登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020817;overflow:hidden}
.bg-fluid{position:fixed;inset:0;z-index:0}
.bg-fluid canvas{width:100%;height:100%}
.overlay{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 0%,transparent 30%,rgba(2,8,23,.85) 100%)}
.page-wrapper{position:relative;z-index:2;width:100%;max-width:420px;padding:24px 16px}
.card{background:rgba(15,23,42,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(99,102,241,.15);border-radius:24px;padding:44px 36px;box-shadow:0 25px 80px rgba(0,0,0,.5);text-align:center}
.card::before{content:'';position:absolute;top:0;left:24px;right:24px;height:3px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#6366f1);border-radius:0 0 3px 3px}
.page-icon{width:64px;height:64px;margin:0 auto 18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(99,102,241,.3)}
.page-icon svg{width:32px;height:32px;fill:#fff}
.page-title{font-size:26px;font-weight:800;color:#f1f5f9;margin:0 0 6px;letter-spacing:-.5px}
.page-subtitle{font-size:14px;color:#94a3b8;margin:0}
.form-group{margin:28px 0 20px;text-align:left}
.input-wrapper{position:relative}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.35;pointer-events:none}
.form-group input{width:100%;padding:15px 15px 15px 48px;border:2px solid #334155;border-radius:14px;font-size:15px;color:#e2e8f0;background:#0f172a;outline:none;transition:all .25s;font-family:inherit}
.form-group input:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.form-group input::placeholder{color:#475569}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.3);transition:all .25s;font-family:inherit;position:relative;overflow:hidden}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(99,102,241,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-loading{color:transparent!important}
.btn-loading::after{content:'';position:absolute;width:14px;height:14px;top:50%;left:50%;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite}
.login-error{margin-top:18px;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(220,38,38,.1));color:#fca5a5;font-size:14px;line-height:1.5;display:flex;align-items:center;gap:10px;animation:errorShake .5s ease-in-out,fadeIn .3s ease-out}
.login-error::before{content:'⚠️';flex-shrink:0;font-size:16px}
.login-error-hidden{display:none}
.footer-hint{margin-top:24px;font-size:12px;color:#475569;animation:fadeIn .8s ease-out 1s backwards}
.footer-hint a{color:#818cf8;text-decoration:none}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:20000;justify-content:center;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:rgba(15,23,42,.95);border:1px solid rgba(99,102,241,.15);border-radius:22px;padding:28px;max-width:460px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;color:#e2e8f0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes errorShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-5px)}20%,40%,60%,80%{transform:translateX(5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-5px)}20%,40%,60%,80%{transform:translateX(5px)}}
@media(max-width:480px){.card{padding:34px 22px}.page-title{font-size:22px}}
</style>
</head>
<body>
<div class="bg-fluid"><canvas id="fluidCanvas"></canvas></div>
<div class="overlay"></div>
<div class="page-wrapper">
  <div class="card">
    <div class="page-icon"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg></div>
    <h1 class="page-title">管理登录</h1>
    <p class="page-subtitle">请输入管理员密码以继续</p>
    <form id="loginForm">
      <div class="form-group">
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="请输入管理员密码" required disabled>
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="rgba(148,163,184,.4)"/></svg>
        </div>
      </div>
      <button type="submit" class="btn" id="loginBtn" disabled>立即登录</button>
      <div id="errorMsg" class="login-error login-error-hidden"></div>
    </form>
    <div class="footer-hint">Beacon 灯塔 · 管理面板</div>
  </div>
</div>
<div id="ir-modal" class="modal-overlay"><div class="modal" id="ir-modal-content"></div></div>
<script>
(function(){
  var c=document.getElementById('fluidCanvas'),ctx=c.getContext('2d');
  var w,h,time=0,blobs=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<5;i++){blobs.push({x:Math.random()*w,y:Math.random()*h,r:150+Math.random()*200,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,c:['rgba(99,102,241,.12)','rgba(139,92,246,.1)','rgba(59,130,246,.08)','rgba(168,85,247,.06)','rgba(99,102,241,.09)'][i]})}
  function draw(){
    ctx.clearRect(0,0,w,h);time+=.005;
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i];
      b.x+=b.vx;b.y+=b.vy;
      if(b.x<-b.r)b.x=w+b.r;if(b.x>w+b.r)b.x=-b.r;
      if(b.y<-b.r)b.y=h+b.r;if(b.y>h+b.r)b.y=-b.r;
      var nx=b.x+Math.sin(time+i)*80,ny=b.y+Math.cos(time+i*.7)*60;
      var g=ctx.createRadialGradient(nx,ny,b.r*.1,nx,ny,b.r);
      g.addColorStop(0,b.c.replace('.12','.25').replace('.1','.2').replace('.08','.16').replace('.06','.12').replace('.09','.18'));
      g.addColorStop(.5,b.c);
      g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(nx,ny,b.r,0,Math.PI*2);ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

document.addEventListener('DOMContentLoaded',async()=>{
  var p=document.getElementById('password'),b=document.getElementById('loginBtn'),m=document.getElementById('ir-modal'),r='https://github.com/bia-pain-bache/BPB-Worker-Panel';
  var e=function(){p.removeAttribute('disabled');b.removeAttribute('disabled');p.focus()};
  try{var c=new AbortController(),t=setTimeout(function(){c.abort()},3000),res=await fetch('/cdn-cgi/trace',{signal:c.signal});clearTimeout(t);
  if(!res.ok)throw new Error();var txt=await res.text(),loc=txt.split('\n').find(function(l){return l.startsWith('loc=')});
  if(loc&&loc.split('=')[1].trim()==='IR'){
    var lang=navigator.language||navigator.userLanguage,mc=document.getElementById('ir-modal-content');
    var bs='display:inline-block;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:14px 28px;border-radius:14px;font-weight:700;font-size:16px;border:none;cursor:pointer;margin:8px;font-family:inherit';
    var b2='display:inline-block;background:#1e293b;color:#94a3b8;padding:14px 28px;border-radius:14px;font-weight:500;font-size:15px;border:none;cursor:pointer;margin:8px;font-family:inherit';
    var h='';if(lang.startsWith('zh'))h='<div style="background:linear-gradient(135deg,#dc2626,#991b1b);padding:36px 20px;text-align:center"><div style="font-size:56px;margin-bottom:16px;animation:shake 2s infinite">&#x1F512;</div><h2 style="color:#fff;font-size:28px;font-weight:800;margin:0">地域访问限制</h2></div><div style="padding:36px;line-height:1.8"><div style="background:rgba(220,38,38,.15);border-left:3px solid #dc2626;padding:18px;border-radius:12px;margin-bottom:26px"><p style="font-size:15px;color:#fca5a5;margin:0">很遗憾，由于网络环境差异，此项目暂不适配伊朗用户。建议使用伊朗本地群组维护的专业项目。</p></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button id="accept-suggestion" style="'+bs+'">&#x2B50; 使用 BPB-Worker-Panel</button><button id="stay-current" style="'+b2+'">继续使用当前项目</button></div></div>';
    else if(lang.startsWith('en'))h='<div style="background:linear-gradient(135deg,#dc2626,#991b1b);padding:36px 20px;text-align:center"><div style="font-size:56px;margin-bottom:16px;animation:shake 2s infinite">&#x1F512;</div><h2 style="color:#fff;font-size:28px;font-weight:800;margin:0">Geographic Restriction</h2></div><div style="padding:36px;line-height:1.8"><div style="background:rgba(220,38,38,.15);border-left:3px solid #dc2626;padding:18px;border-radius:12px;margin-bottom:26px"><p style="font-size:15px;color:#fca5a5;margin:0">This project cannot provide optimal service in your region.</p></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button id="accept-suggestion" style="'+bs+'">&#x2B50; Use BPB-Worker-Panel</button><button id="stay-current" style="'+b2+'">Continue</button></div></div>';
    else h='<div style="background:linear-gradient(135deg,#dc2626,#991b1b);padding:36px 20px;text-align:center"><div style="font-size:56px;margin-bottom:16px;animation:shake 2s infinite">&#x1F512;</div><h2 style="color:#fff;font-size:28px;font-weight:800;margin:0">دسترسی جغرافیایی محدود</h2></div><div style="padding:36px;text-align:right;line-height:1.8;direction:rtl"><div style="background:rgba(220,38,38,.15);border-right:3px solid #dc2626;padding:18px;border-radius:12px;margin-bottom:26px"><p style="font-size:15px;color:#fca5a5;margin:0">برای خدمات بهتر، پروژه‌های متخصص توسعه‌یافته توسط جامعه توسعه‌دهندگان ایرانی را توصیه می‌کنیم.</p></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;direction:ltr"><button id="accept-suggestion" style="'+bs+'">&#x2B50; استفاده از BPB-Worker-Panel</button><button id="stay-current" style="'+b2+'">ادامه با پروژه فعلی</button></div></div>';
    mc.innerHTML=h;m.classList.add('show');
    var ab=document.getElementById('accept-suggestion'),sb=document.getElementById('stay-current'),rt=setTimeout(function(){window.location.href=r},8000);
    ab.onclick=function(){clearTimeout(rt);window.location.href=r};
    sb.onclick=function(){clearTimeout(rt);m.classList.remove('show');e()};
  }else e()}catch(err){console.log(err);e()}
});
document.getElementById('loginForm').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var pw=document.getElementById('password').value,lb=document.getElementById('loginBtn'),em=document.getElementById('errorMsg'),pi=document.getElementById('password');
  em.classList.add('login-error-hidden');lb.disabled=true;lb.classList.add('btn-loading');
  try{
    var res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(pw)});
    if(res.ok){var ct=res.headers.get('content-type');if(ct&&ct.includes('application/json')){var d=await res.json();if(d.success)window.location.href='/admin'}else{em.textContent='密码错误，请重试';em.classList.remove('login-error-hidden');pi.focus();pi.select()}}
    else{em.textContent='登录失败，请重试';em.classList.remove('login-error-hidden')}
  }catch(err){console.error(err);em.textContent='网络错误，请检查连接';em.classList.remove('login-error-hidden')}
  finally{lb.disabled=false;lb.classList.remove('btn-loading')}
});
</script>
</body>
</html>
