<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beacon 灯塔 · 管理登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#FF9AA2;--pink-deep:#FF808D;--lavender:#C3B1E1;--lavender-deep:#B5A0D8;--text:#fff;--text-soft:rgba(255,255,255,.75);--glass-bg:rgba(255,255,255,.12);--glass-border:rgba(255,255,255,.18)}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:url(https://haowallpaper.com/link/common/file/previewFileImg/18834482406280576) center/cover fixed;position:relative}
body::before{content:'';position:fixed;inset:0;background:rgba(25,15,35,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:0}
.page-wrapper{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}
.card{background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:24px;padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;position:relative}
.card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:3px;background:linear-gradient(90deg,var(--pink),var(--lavender));border-radius:0 0 3px 3px}
.page-icon{width:60px;height:60px;margin:0 auto 16px;background:linear-gradient(135deg,var(--pink),var(--lavender-deep));border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,154,162,.3)}
.page-icon svg{width:30px;height:30px;fill:#fff}
.page-title{font-size:24px;font-weight:800;color:#fff;margin:0 0 6px}
.page-subtitle{font-size:13px;color:var(--text-soft);margin:0}
.form-group{margin:26px 0 18px;text-align:left}
.input-wrapper{position:relative}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.35;pointer-events:none}
.form-group input{width:100%;padding:14px 14px 14px 44px;border:1px solid rgba(255,255,255,.15);border-radius:14px;font-size:15px;color:#fff;background:rgba(255,255,255,.08);outline:none;transition:all .25s;font-family:inherit}
.form-group input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,154,162,.2);background:rgba(255,255,255,.12)}
.form-group input::placeholder{color:rgba(255,255,255,.3)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;box-shadow:0 4px 16px rgba(255,154,162,.3);transition:all .25s;font-family:inherit;position:relative;overflow:hidden}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 22px rgba(255,154,162,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-loading{color:transparent!important}
.btn-loading::after{content:'';position:absolute;width:14px;height:14px;top:50%;left:50%;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite}
.login-error{margin-top:16px;padding:12px 16px;border-radius:12px;background:rgba(244,160,168,.15);color:#F4A0A8;font-size:13px;line-height:1.5;display:flex;align-items:center;gap:8px;animation:fadeIn .3s}
.login-error::before{content:'\26A0\FE0F';flex-shrink:0;font-size:14px}
.login-error-hidden{display:none}
.footer-hint{margin-top:20px;font-size:12px;color:rgba(255,255,255,.45)}
.footer-hint a{color:var(--pink);text-decoration:none}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:20000;justify-content:center;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:rgba(25,20,35,.95);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px;max-width:460px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-5px)}20%,40%,60%,80%{transform:translateX(5px)}}
@media(max-width:480px){.card{padding:30px 20px}}
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="card">
    <div class="page-icon"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg></div>
    <h1 class="page-title">管理登录</h1>
    <p class="page-subtitle">请输入管理员密码以继续</p>
    <form id="loginForm">
      <div class="form-group">
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="请输入管理员密码" required disabled>
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="rgba(255,255,255,.35)"/></svg>
        </div>
      </div>
      <button type="submit" class="btn" id="loginBtn" disabled>立即登录</button>
      <div id="errorMsg" class="login-error login-error-hidden"></div>
    </form>
    <div class="footer-hint">Beacon 灯塔 · 管理面板</div>
  </div>
</div>
<div id="ir-modal" class="modal-overlay"><div class="modal" id="ir-modal-content"></div></div>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
const p=document.getElementById('password'),b=document.getElementById('loginBtn'),m=document.getElementById('ir-modal'),r='https://github.com/bia-pain-bache/BPB-Worker-Panel';
const e=()=>{p.removeAttribute('disabled');b.removeAttribute('disabled');p.focus()};
try{const c=new AbortController(),t=setTimeout(()=>c.abort(),3000),res=await fetch('/cdn-cgi/trace',{signal:c.signal});clearTimeout(t);
if(!res.ok)throw new Error();
const txt=await res.text(),loc=txt.split('\n').find(l=>l.startsWith('loc='));
if(loc&&loc.split('=')[1].trim()==='IR'){
const lang=navigator.language||navigator.userLanguage,mc=document.getElementById('ir-modal-content');
const bs='display:inline-block;background:linear-gradient(135deg,#FF9AA2,#FF808D);color:#fff;padding:14px 28px;border-radius:14px;font-weight:700;font-size:16px;border:none;cursor:pointer;margin:8px;font-family:inherit';
const b2='display:inline-block;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);padding:14px 28px;border-radius:14px;font-weight:500;font-size:15px;border:none;cursor:pointer;margin:8px;font-family:inherit';
let h='';
if(lang.startsWith('zh'))h='<div style="background:linear-gradient(135deg,#dc2626,#991b1b);padding:36px 20px;text-align:center"><div style="font-size:56px;margin-bottom:16px;animation:shake 2s infinite">&#x1F512;</div><h2 style="color:#fff;font-size:28px;font-weight:800;margin:0">地域访问限制</h2></div><div style="padding:36px;line-height:1.8"><div style="background:rgba(220,38,38,.15);border-left:3px solid #dc2626;padding:18px;border-radius:12px;margin-bottom:26px"><p style="font-size:15px;color:#fca5a5;margin:0">很遗憾，由于网络环境差异，此项目暂不适配伊朗用户。建议使用伊朗本地群组维护的专业项目。</p></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button id="accept-suggestion" style="'+bs+'">&#x2B50; 使用 BPB-Worker-Panel</button><button id="stay-current" style="'+b2+'">继续使用当前项目</button></div></div>';
else if(lang.startsWith('en'))h='<div style="background:linear-gradient(135deg,#dc2626,#991b1b);padding:36px 20px;text-align:center"><div style="font-size:56px;margin-bottom:16px;animation:shake 2s infinite">&#x1F512;</div><h2 style="color:#fff;font-size:28px;font-weight:800;margin:0">Geographic Restriction</h2></div><div style="padding:36px;line-height:1.8"><div style="background:rgba(220,38,38,.15);border-left:3px solid #dc2626;padding:18px;border-radius:12px;margin-bottom:26px"><p style="font-size:15px;color:#fca5a5;margin:0">This project cannot provide optimal service in your region. Please use specialized solutions maintained by the Iranian developer community.</p></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button id="accept-suggestion" style="'+bs+'">&#x2B50; Use BPB-Worker-Panel</button><button id="stay-current" style="'+b2+'">Continue with current project</button></div></div>';
else h='<div style="background:linear-gradient(135deg,#dc2626,#991b1b);padding:36px 20px;text-align:center"><div style="font-size:56px;margin-bottom:16px;animation:shake 2s infinite">&#x1F512;</div><h2 style="color:#fff;font-size:28px;font-weight:800;margin:0">دسترسی جغرافیایی محدود</h2></div><div style="padding:36px;text-align:right;line-height:1.8;direction:rtl"><div style="background:rgba(220,38,38,.15);border-right:3px solid #dc2626;padding:18px;border-radius:12px;margin-bottom:26px"><p style="font-size:15px;color:#fca5a5;margin:0">برای خدمات بهتر، پروژه‌های متخصص توسعه‌یافته توسط جامعه توسعه‌دهندگان ایرانی را توصیه می‌کنیم.</p></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;direction:ltr"><button id="accept-suggestion" style="'+bs+'">&#x2B50; استفاده از BPB-Worker-Panel</button><button id="stay-current" style="'+b2+'">ادامه با پروژه فعلی</button></div></div>';
mc.innerHTML=h;m.classList.add('show');
const ab=document.getElementById('accept-suggestion'),sb=document.getElementById('stay-current'),rt=setTimeout(()=>{window.location.href=r},8000);
ab.onclick=()=>{clearTimeout(rt);window.location.href=r};
sb.onclick=()=>{clearTimeout(rt);m.classList.remove('show');e()};
}else e()}catch(err){console.log('Location check failed:',err);e()}
});
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
e.preventDefault();
const pw=document.getElementById('password').value,lb=document.getElementById('loginBtn'),em=document.getElementById('errorMsg'),pi=document.getElementById('password');
em.classList.add('login-error-hidden');lb.disabled=true;lb.classList.add('btn-loading');
try{
const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(pw)});
if(res.ok){const ct=res.headers.get('content-type');
if(ct&&ct.includes('application/json')){const d=await res.json();if(d.success)window.location.href='/admin'}
else{em.textContent='密码错误，请重试';em.classList.remove('login-error-hidden');pi.focus();pi.select()}
}else{em.textContent='登录失败，请重试';em.classList.remove('login-error-hidden')}
}catch(err){console.error('登录错误:',err);em.textContent='网络错误，请检查连接';em.classList.remove('login-error-hidden')}
finally{lb.disabled=false;lb.classList.remove('btn-loading')}
});
</script>
</body>
</html>
