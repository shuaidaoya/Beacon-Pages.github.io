<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Beacon 灯塔 · 用户面板</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 50%,#f8fafc 100%);
  color:#1f2937;min-height:100vh;
}
/* ── topbar ── */
.topbar{
  background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,#faab41,#f6821f);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-icon svg{width:20px;height:20px;fill:#fff}
.brand-name{font-size:18px;font-weight:800;color:#1f2937}
.brand-sub{font-size:11px;color:#9ca3af;margin-left:6px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.topbar-btn{
  background:#fff;border:1px solid #d1d5db;color:#374151;padding:8px 14px;
  border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;
  transition:all .2s;white-space:nowrap;
}
.topbar-btn:hover{background:#f3f4f6}
.topbar-btn.primary{background:linear-gradient(135deg,#faab41,#f6821f);color:#fff;border-color:transparent}
.topbar-btn.primary:hover{opacity:.92}
/* ── main ── */
.main{max-width:960px;margin:0 auto;padding:24px 20px 40px}
/* ── hero ── */
.hero{
  text-align:center;margin-bottom:28px;padding:28px 20px 24px;
  background:#fff;border:1px solid #e5e7eb;border-radius:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.hero h1{font-size:22px;font-weight:800;margin:0 0 4px;color:#1f2937}
.hero p{font-size:14px;color:#6b7280;margin:0}
/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{
  background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);text-align:center;
}
.stat-icon{font-size:24px;margin-bottom:6px}
.stat-num{font-size:22px;font-weight:800;color:#1f2937;line-height:1.3;word-break:break-all}
.stat-label{font-size:12px;color:#6b7280;margin-top:4px}
/* ── section title ── */
.sec-title{
  font-size:16px;font-weight:700;color:#1f2937;margin:0 0 12px;
  display:flex;align-items:center;gap:8px;
}
/* ── link cards ── */
.links{display:grid;gap:10px;margin-bottom:24px}
.link-card{
  background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;justify-content:space-between;
}
.link-label{font-weight:700;font-size:14px;color:#1f2937;min-width:100px}
.link-value{
  flex:1;min-width:200px;font-size:12px;color:#374151;word-break:break-all;
  font-family:'SF Mono','Monaco','Menlo',monospace;background:#f9fafb;
  padding:8px 12px;border-radius:8px;border:1px solid #e5e7eb;
}
.link-btn{
  background:linear-gradient(135deg,#faab41,#f6821f);color:#fff;border:none;
  border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .2s;
}
.link-btn:hover{opacity:.9;transform:translateY(-1px)}
.link-btn:active{transform:scale(.97)}
/* ── copy toast ── */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
  background:#16a34a;color:#fff;padding:10px 24px;border-radius:12px;font-size:14px;
  font-weight:600;box-shadow:0 8px 24px rgba(22,163,74,.3);
  animation:fadeIn .3s;pointer-events:none;
}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* ── empty ── */
.empty{padding:60px 20px;text-align:center;color:#9ca3af}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h2{font-size:18px;color:#6b7280;margin:0 0 8px}
.empty p{font-size:13px;margin:0 0 16px}
/* ── responsive ── */
@media(max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .topbar{padding:12px 16px}
  .main{padding:16px 12px 30px}
  .link-card{flex-direction:column;align-items:flex-start}
  .link-value{width:100%}
}
@media(max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .stat-num{font-size:18px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <span class="brand-name">Beacon 灯塔</span>
    <span class="brand-sub">用户面板</span>
  </div>
  <div class="topbar-actions">
    <span id="userLabel" style="font-size:13px;color:#6b7280"></span>
    <a href="/register" class="topbar-btn">🔄 切换账户</a>
    <button class="topbar-btn primary" onclick="location.href='/'">🏠 首页</button>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="empty" id="emptyState">
    <div class="empty-icon">🔐</div>
    <h2>未登录</h2>
    <p>请先通过认证面板登录以查看您的仪表盘</p>
    <a href="/register" class="topbar-btn primary" style="display:inline-block">前往登录</a>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ── read user data from URL params ──
  const params = new URLSearchParams(location.search);
  const account  = params.get('account') || '';
  const email    = params.get('email') || '';
  const uuid     = params.get('uuid') || '';
  const token    = params.get('token') || '';
  const subUrl   = params.get('sub') || '';
  const verUrl   = params.get('version') || '';

  // If no user data, try sessionStorage fallback
  if (!account && !uuid) {
    const stored = sessionStorage.getItem('beacon_user');
    if (stored) {
      try {
        const d = JSON.parse(stored);
        renderDashboard(d);
      } catch(e) { /* stay on empty */ }
    }
    // still fetch network info
    fetchNetworkInfo();
    return;
  }

  const userData = { account, email, uuid, token, subUrl, verUrl };
  sessionStorage.setItem('beacon_user', JSON.stringify(userData));
  renderDashboard(userData);
  fetchNetworkInfo();

  function renderDashboard(d) {
    const main = document.getElementById('mainContent');
    const host = location.origin;

    // subscription URL fallback
    const subscriptionUrl = d.subUrl || (d.uuid && d.token ? (host + '/sub?uuid=' + encodeURIComponent(d.uuid) + '&token=' + encodeURIComponent(d.token)) : '');
    const versionUrl     = d.verUrl || (d.uuid ? (host + '/version?uuid=' + encodeURIComponent(d.uuid)) : '');

    main.innerHTML = `
      <div class="hero">
        <h1>👋 欢迎回来，${esc(d.account || '用户')}</h1>
        <p>${esc(d.email || '')}${d.uuid ? ' · UUID: ' + esc(d.uuid.slice(0,8) + '...') : ''}</p>
      </div>

      <div class="stats" id="statCards">
        <div class="stat-card"><div class="stat-icon">🌐</div><div class="stat-num" id="stat-ip">检测中...</div><div class="stat-label">IP 地址</div></div>
        <div class="stat-card"><div class="stat-icon">📍</div><div class="stat-num" id="stat-loc">检测中...</div><div class="stat-label">位置 / 数据中心</div></div>
        <div class="stat-card"><div class="stat-icon">🔒</div><div class="stat-num" id="stat-tls">检测中...</div><div class="stat-label">连接加密</div></div>
        <div class="stat-card"><div class="stat-icon">📡</div><div class="stat-num" id="stat-warp">检测中...</div><div class="stat-label">WARP / 网关</div></div>
      </div>

      <div class="sec-title">🔗 订阅链接</div>
      <div class="links">
        ${subscriptionUrl ? `
        <div class="link-card">
          <span class="link-label">📋 订阅地址</span>
          <span class="link-value">${esc(subscriptionUrl)}</span>
          <button class="link-btn" data-copy="${escAttr(subscriptionUrl)}">📋 复制</button>
        </div>` : ''}
        ${versionUrl ? `
        <div class="link-card">
          <span class="link-label">📦 版本查询</span>
          <span class="link-value">${esc(versionUrl)}</span>
          <button class="link-btn" data-copy="${escAttr(versionUrl)}">📋 复制</button>
        </div>` : ''}
        ${d.uuid ? `
        <div class="link-card">
          <span class="link-label">🆔 用户 UUID</span>
          <span class="link-value">${esc(d.uuid)}</span>
          <button class="link-btn" data-copy="${escAttr(d.uuid)}">📋 复制</button>
        </div>` : ''}
        ${d.token ? `
        <div class="link-card">
          <span class="link-label">🔑 订阅 Token</span>
          <span class="link-value">${esc(d.token)}</span>
          <button class="link-btn" data-copy="${escAttr(d.token)}">📋 复制</button>
        </div>` : ''}
      </div>
    `;

    // update topbar
    const userLabel = document.getElementById('userLabel');
    if (userLabel && d.account) userLabel.textContent = '👤 ' + esc(d.account);

    // attach copy handlers
    main.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', () => copy(btn.dataset.copy, btn));
    });
  }

  async function fetchNetworkInfo() {
    try {
      const resp = await fetch('https://speed.cloudflare.com/cdn-cgi/trace');
      const text = await resp.text();
      const trace = {};
      text.split('\n').forEach(line => {
        const idx = line.indexOf('=');
        if (idx > 0) trace[line.slice(0,idx).trim()] = line.slice(idx+1).trim();
      });

      const ip     = trace.ip || '-';
      const colo   = trace.colo || '-';
      const loc    = trace.loc || '-';
      const tls    = trace.tls || '-';
      const http   = trace.http || '-';
      const warp   = trace.warp || '-';
      const gateway = trace.gateway || '-';

      setStat('stat-ip',   ip);
      setStat('stat-loc',  (loc !== '-' ? loc + ' / ' : '') + colo);
      setStat('stat-tls',  tls + (http !== '-' ? ' / ' + http.toUpperCase() : ''));
      setStat('stat-warp', warp === 'on' ? 'WARP ✅' : 'WARP ' + (gateway === 'on' ? 'Gateway' : '直连'));
    } catch(e) {
      ['stat-ip','stat-loc','stat-tls','stat-warp'].forEach(id => setStat(id, '不可用'));
    }
  }

  function setStat(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  function copy(text, btn) {
    const orig = btn.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => { btn.textContent = '✅ 已复制'; setTimeout(() => btn.textContent = orig, 1500); });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      btn.textContent = '✅ 已复制'; setTimeout(() => btn.textContent = orig, 1500);
    }
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

})();
</script>
</body>
</html>
