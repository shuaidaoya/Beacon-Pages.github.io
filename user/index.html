<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Beacon 灯塔 · 用户面板</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 50%,#f8fafc 100%);
  color:#1f2937;min-height:100vh;
}
/* ── topbar ── */
.topbar{
  background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,#faab41,#f6821f);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-icon svg{width:20px;height:20px;fill:#fff}
.brand-name{font-size:18px;font-weight:800;color:#1f2937}
.brand-sub{font-size:11px;color:#9ca3af;margin-left:6px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.topbar-btn{
  background:#fff;border:1px solid #d1d5db;color:#374151;padding:8px 14px;
  border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;
  transition:all .2s;white-space:nowrap;
}
.topbar-btn:hover{background:#f3f4f6}
.topbar-btn.primary{background:linear-gradient(135deg,#faab41,#f6821f);color:#fff;border-color:transparent}
.topbar-btn.primary:hover{opacity:.92}
/* ── main ── */
.main{max-width:960px;margin:0 auto;padding:24px 20px 40px}
/* ── hero ── */
.hero{
  text-align:center;margin-bottom:28px;padding:28px 20px 24px;
  background:#fff;border:1px solid #e5e7eb;border-radius:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.hero h1{font-size:22px;font-weight:800;margin:0 0 4px;color:#1f2937}
.hero p{font-size:14px;color:#6b7280;margin:0}
/* ── network cards ── */
.sec-title{
  font-size:16px;font-weight:700;color:#1f2937;margin:0 0 12px;
  display:flex;align-items:center;gap:8px;
}
.network-cards-container{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;
}
.network-card{
  background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:16px;
  position:relative;overflow:hidden;transition:all .3s;
  box-shadow:0 4px 6px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:center;
}
.network-card:hover{transform:translateY(-4px);border-color:#f6821f;box-shadow:0 12px 20px rgba(246,130,31,.15)}
.network-card-title{
  font-size:14px;color:#1f2937;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:8px;font-weight:700;
}
.status-indicator{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-indicator.loading{background:#f59e0b;animation:pulse 1s infinite}
.status-indicator.success{background:#16a34a}
.status-indicator.error{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.title-text{display:flex;flex-direction:column;gap:2px}
.title-main{font-size:14px}
.title-subtitle{font-size:11px;color:#9ca3af;font-weight:500}
.network-info-content{display:flex;flex-direction:column;gap:4px}
.ip-text{font-size:18px;font-weight:700;color:#1f2937;font-family:'SF Mono','Monaco','Menlo',monospace}
.ip-text.clickable{cursor:pointer}
.ip-text.clickable:hover{color:#f6821f}
.location-text{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;min-height:18px}
.country-flag{width:20px;height:14px;border-radius:2px;object-fit:cover;flex-shrink:0}
.network-tip{font-size:11px;color:#9ca3af;margin-top:4px}
/* ── link cards ── */
.links{display:grid;gap:10px;margin-bottom:24px}
.link-card{
  background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;justify-content:space-between;
}
.link-label{font-weight:700;font-size:14px;color:#1f2937;min-width:100px}
.link-value{
  flex:1;min-width:200px;font-size:12px;color:#374151;word-break:break-all;
  font-family:'SF Mono','Monaco','Menlo',monospace;background:#f9fafb;
  padding:8px 12px;border-radius:8px;border:1px solid #e5e7eb;
}
.link-btn{
  background:linear-gradient(135deg,#faab41,#f6821f);color:#fff;border:none;
  border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .2s;
}
.link-btn:hover{opacity:.9;transform:translateY(-1px)}
/* ── toast ── */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
  background:#16a34a;color:#fff;padding:10px 24px;border-radius:12px;font-size:14px;
  font-weight:600;box-shadow:0 8px 24px rgba(22,163,74,.3);
  animation:fadeIn .3s;pointer-events:none;
}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* ── empty ── */
.empty{padding:60px 20px;text-align:center;color:#9ca3af}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h2{font-size:18px;color:#6b7280;margin:0 0 8px}
.empty p{font-size:13px;margin:0 0 16px}
/* ── responsive ── */
@media(max-width:768px){
  .network-cards-container{grid-template-columns:repeat(2,1fr)}
  .topbar{padding:12px 16px}
  .main{padding:16px 12px 30px}
  .link-card{flex-direction:column;align-items:flex-start}
  .link-value{width:100%}
}
@media(max-width:480px){
  .network-cards-container{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <span class="brand-name">Beacon 灯塔</span>
    <span class="brand-sub">用户面板</span>
  </div>
  <div class="topbar-actions">
    <span id="userLabel" style="font-size:13px;color:#6b7280"></span>
    <a href="/register" class="topbar-btn">🔄 切换账户</a>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="empty" id="emptyState">
    <div class="empty-icon">🔐</div>
    <h2>未登录</h2>
    <p>请先通过认证面板登录以查看您的仪表盘</p>
    <a href="/register" class="topbar-btn primary" style="display:inline-block">前往登录</a>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ── helpers ──
  function $(sel) { return document.querySelector(sel); }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtBytes(b) { if (!b||b<=0) return '0 B'; const k=1024,u=['B','KB','MB','GB','TB']; const i=Math.floor(Math.log(b)/Math.log(k)); return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+u[i]; }
  function fmtTime(ms) { if (!ms) return '-'; return new Date(ms).toLocaleString('zh-CN', { hour12:false }); }

  function setStatus(id, state) {
    const el = $(id);
    if (!el) return;
    el.className = 'status-indicator ' + state;
  }

  function setIp(id, text) {
    const el = $(id);
    if (!el) return;
    el.textContent = text || '未知';
    el.dataset.rawValue = text || '';
  }

  function setLocation(id, text, flagUrl) {
    const el = $(id);
    if (!el) return;
    let html = '';
    if (flagUrl) html += '<img class="country-flag" src="'+escAttr(flagUrl)+'" alt=""> ';
    html += esc(text || '未知');
    el.innerHTML = html;
  }

  function setSubtitle(id, text) {
    const el = $(id);
    if (el) el.textContent = text || '';
  }

  // ── fetch helpers ──
  async function fetchJson(url, timeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs || 6000);
    try {
      const resp = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      return await resp.json();
    } catch(e) { clearTimeout(t); throw e; }
  }

  async function fetchTrace(url, timeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs || 6000);
    try {
      const resp = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      const text = await resp.text();
      const trace = {};
      text.split('\n').forEach(line => {
        const idx = line.indexOf('=');
        if (idx > 0) trace[line.slice(0,idx).trim()] = line.slice(idx+1).trim();
      });
      return trace;
    } catch(e) { clearTimeout(t); throw e; }
  }

  // ═══════════════════════════════
  //  1. 国内测试 (CN-Test)
  // ═══════════════════════════════
  async function fetchDomestic() {
    setStatus('#status-ipip', 'loading');
    try {
      // Try multiple domestic-oriented APIs
      const data = await fetchJson('https://api.ipapi.is?lang=zh-CN', 5000);
      const ip = data.ip || '未知';
      const cc = (data.location?.country_code || '').toLowerCase();
      const city = data.location?.city || '';
      const locText = [data.location?.country || '', city].filter(Boolean).join(' ');
      const flagUrl = cc ? 'https://flagcdn.com/24x18/'+cc+'.png' : '';

      setIp('#ipip-ip', ip);
      setLocation('#ipip-country', locText, flagUrl);
      setSubtitle('#ipip-provider', 'ipapi.is');
      setStatus('#status-ipip', 'success');
    } catch(e) {
      // fallback: CF trace
      try {
        const trace = await fetchTrace('https://speed.cloudflare.com/cdn-cgi/trace', 4000);
        setIp('#ipip-ip', trace.ip || '未知');
        setLocation('#ipip-country', (trace.loc||'') + ' / ' + (trace.colo||''));
        setSubtitle('#ipip-provider', 'Cloudflare');
        setStatus('#status-ipip', 'success');
      } catch(e2) {
        setIp('#ipip-ip', '加载失败');
        setStatus('#status-ipip', 'error');
      }
    }
  }

  // ═══════════════════════════════
  //  2. 国外测试 (漏网之鱼)
  // ═══════════════════════════════
  async function fetchOverseas() {
    setStatus('#status-overseas', 'loading');
    try {
      const data = await fetchJson('https://api.cmliussss.net/api/ipinfo?_t='+Date.now(), 5000);
      const ip = data.ip || '未知';
      const cc = (data.country_code || '').toLowerCase();
      const locText = [data.country_code||'', data.asn||'', data.as_name||''].filter(Boolean).join(' ');
      const flagUrl = cc ? 'https://flagcdn.com/24x18/'+cc+'.png' : '';

      setIp('#overseas-ip', ip);
      setLocation('#overseas-country', locText, flagUrl);
      setSubtitle('#overseas-provider', 'cmliussss.net');
      setStatus('#status-overseas', 'success');
    } catch(e) {
      // fallback to ipapi.is
      try {
        const data = await fetchJson('https://api.ipapi.is', 4000);
        const ip = data.ip || '未知';
        const cc = (data.location?.country_code || '').toLowerCase();
        const locText = [data.location?.country_code||'', 'AS'+data.asn?.asn, data.asn?.org].filter(Boolean).join(' ');
        const flagUrl = cc ? 'https://flagcdn.com/24x18/'+cc+'.png' : '';
        setIp('#overseas-ip', ip);
        setLocation('#overseas-country', locText, flagUrl);
        setSubtitle('#overseas-provider', 'ipapi.is');
        setStatus('#status-overseas', 'success');
      } catch(e2) {
        setIp('#overseas-ip', '加载失败');
        setStatus('#status-overseas', 'error');
      }
    }
  }

  // ═══════════════════════════════
  //  3. CloudFlare (ProxyIP)
  // ═══════════════════════════════
  async function fetchCloudFlare() {
    setStatus('#status-cf', 'loading');
    try {
      const trace = await fetchTrace('https://speed.cloudflare.com/cdn-cgi/trace', 5000);
      const ip = trace.ip || '未知';
      const colo = trace.colo || '';
      const loc = trace.loc || '';

      setIp('#cf-ip', ip);
      setLocation('#cf-country', loc + (colo ? ' / ' + colo : ''));
      setSubtitle('#cf-provider', 'Cloudflare CDN');
      setStatus('#status-cf', 'success');
    } catch(e) {
      setIp('#cf-ip', '加载失败');
      setStatus('#status-cf', 'error');
    }
  }

  // ═══════════════════════════════
  //  4. 墙外测试 (!CN-Test)
  // ═══════════════════════════════
  async function fetchWallTest() {
    setStatus('#status-twitter', 'loading');
    try {
      // Use a different endpoint to simulate wall-test perspective
      const data = await fetchJson('https://api.ipapi.is?lang=en', 5000);
      const ip = data.ip || '未知';
      const cc = (data.location?.country_code || '').toLowerCase();
      const org = data.asn?.org || '';
      const locText = [data.location?.country||'', data.location?.city||'', org].filter(Boolean).join(' · ');
      const flagUrl = cc ? 'https://flagcdn.com/24x18/'+cc+'.png' : '';

      setIp('#twitter-ip', ip);
      setLocation('#twitter-country', locText, flagUrl);
      setSubtitle('#twitter-provider', 'ipapi.is');
      setStatus('#status-twitter', 'success');
    } catch(e) {
      try {
        const trace = await fetchTrace('https://speed.cloudflare.com/cdn-cgi/trace', 4000);
        setIp('#twitter-ip', trace.ip || '未知');
        setLocation('#twitter-country', (trace.loc||'') + ' / ' + (trace.colo||''));
        setSubtitle('#twitter-provider', 'Cloudflare');
        setStatus('#status-twitter', 'success');
      } catch(e2) {
        setIp('#twitter-ip', '加载失败');
        setStatus('#status-twitter', 'error');
      }
    }
  }

  // ── load all cards ──
  function loadNetworkCards() {
    fetchDomestic();
    fetchOverseas();
    fetchCloudFlare();
    fetchWallTest();
  }

  // ── global stats ──
  async function fetchGlobalStats() {
    try {
      const resp = await fetch('/api/stats');
      const data = await resp.json();
      setText('globalUpValue', data.累计上行 || '--');
      setText('globalDownValue', data.累计下行 || '--');
      setText('onlineCount', data.在线人数 != null ? String(data.在线人数) : '--');
    } catch(e) {
      setText('globalUpValue', '--');
      setText('globalDownValue', '--');
      setText('onlineCount', '--');
    }
  }

  function setText(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  // ── copy helper ──
  function copy(text, btn) {
    const orig = btn.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => { btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent=orig,1500); });
    } else {
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
      btn.textContent='✅ 已复制';setTimeout(()=>btn.textContent=orig,1500);
    }
  }

  function updateTrafficDisplay(d) {
    const usedEl = document.getElementById('usedTrafficValue');
    const totalEl = document.getElementById('totalTrafficValue');
    if (usedEl) usedEl.textContent = fmtBytes(d.used_traffic || 0);
    if (totalEl) totalEl.textContent = d.traffic > 0 ? fmtBytes(d.traffic) : '不限';
  }

  function updateCheckinDisplay(d, msg, isError) {
    const btn = document.getElementById('checkinBtn');
    const statusEl = document.getElementById('checkinStatus');
    const metaEl = document.getElementById('checkinMeta');
    const checkin = d.checkin || {};
    const minGB = checkin.minRewardGB || 2;
    const maxGB = checkin.maxRewardGB || 20;
    if (metaEl) {
      const parts = ['每日随机领取 ' + minGB + '-' + maxGB + ' GB'];
      if (checkin.totalClaimDays) parts.push('累计签到 ' + checkin.totalClaimDays + ' 天');
      metaEl.textContent = parts.join(' · ');
    }
    if (!btn || !statusEl) return;
    statusEl.style.color = isError ? '#dc2626' : '#64748b';
    if (!d.uuid || !d.token) {
      btn.disabled = true;
      btn.textContent = '无法签到';
      statusEl.textContent = msg || '缺少用户凭证，请重新登录。';
      return;
    }
    if (checkin.enabled === false || checkin.eligible === false) {
      btn.disabled = true;
      btn.textContent = '无需签到';
      statusEl.textContent = msg || checkin.message || '无限制总配额用户无需签到。';
      return;
    }
    if (checkin.claimedToday) {
      btn.disabled = true;
      btn.textContent = '今日已签到';
      statusEl.textContent = msg || ('今天已领取 ' + fmtBytes(checkin.rewardBytes || 0) + '，下次可签到时间：' + fmtTime(checkin.nextAt));
      return;
    }
    btn.disabled = false;
    btn.textContent = '签到领流量';
    statusEl.textContent = msg || (checkin.claimedAt ? ('上次领取 ' + fmtBytes(checkin.rewardBytes || 0) + '，今天还可以再领一次。') : '今天还没签到，点击按钮领取流量。');
  }

  async function claimDailyCheckin() {
    const btn = document.getElementById('checkinBtn');
    const stored = sessionStorage.getItem('beacon_user');
    if (!stored) return;
    let current;
    try {
      current = JSON.parse(stored);
    } catch (e) {
      return;
    }
    if (!current.uuid || !current.token) {
      updateCheckinDisplay(current, '缺少用户凭证，请重新登录。', true);
      return;
    }
    if (current.checkin && (current.checkin.enabled === false || current.checkin.eligible === false)) {
      updateCheckinDisplay(current, current.checkin.message || '无限制总配额用户无需签到。');
      return;
    }
    if (btn) {
      btn.disabled = true;
      btn.textContent = '签到中...';
    }
    try {
      const resp = await fetch('/register/checkin?uuid=' + encodeURIComponent(current.uuid) + '&token=' + encodeURIComponent(current.token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      const payload = await resp.json().catch(() => ({}));
      const data = payload.data || {};
      if (!resp.ok) throw new Error(payload.message || ('HTTP ' + resp.status));
      const node = data.node || {};
      const user = data.user || {};
      const next = {
        ...current,
        account: data.account || current.account || '',
        email: data.email || current.email || '',
        uuid: node.uuid || current.uuid || '',
        token: node.token || current.token || '',
        subUrl: node.subscriptionUrl || current.subUrl || '',
        verUrl: node.versionUrl || current.verUrl || '',
        traffic: user.traffic || 0,
        used_traffic: user.used_traffic || 0,
        checkin: data.checkin || current.checkin || {},
      };
      sessionStorage.setItem('beacon_user', JSON.stringify(next));
      updateTrafficDisplay(next);
      updateCheckinDisplay(next, payload.message || ('签到成功，已领取 ' + fmtBytes(data.rewardBytes || 0) + '。'));
    } catch (e) {
      const currentState = current || {};
      updateCheckinDisplay(currentState, '签到失败：' + (e.message || '未知错误'), true);
    }
  }

  async function refreshUserData() {
    const stored = sessionStorage.getItem('beacon_user');
    if (!stored) return;
    let current;
    try {
      current = JSON.parse(stored);
    } catch (e) {
      return;
    }
    if (!current.uuid || !current.token) return;
    try {
      const resp = await fetchJson('/register/user?uuid=' + encodeURIComponent(current.uuid) + '&token=' + encodeURIComponent(current.token) + '&_t=' + Date.now(), 5000);
      const payload = resp.data || {};
      const node = payload.node || {};
      const user = payload.user || {};
      const next = {
        ...current,
        account: payload.account || current.account || '',
        email: payload.email || current.email || '',
        uuid: node.uuid || current.uuid || '',
        token: node.token || current.token || '',
        subUrl: node.subscriptionUrl || current.subUrl || '',
        verUrl: node.versionUrl || current.verUrl || '',
        traffic: user.traffic || 0,
        used_traffic: user.used_traffic || 0,
        checkin: payload.checkin || current.checkin || {},
      };
      sessionStorage.setItem('beacon_user', JSON.stringify(next));
      updateTrafficDisplay(next);
      updateCheckinDisplay(next);
      fetchGlobalStats(); // 实时更新在线人数+全站流量
      const userLabel = document.getElementById('userLabel');
      if (userLabel && next.account) userLabel.textContent = '👤 ' + next.account;
    } catch (e) {
      // Keep the last successful snapshot when refresh fails.
    }
  }

  // ── render dashboard ──
  function renderDashboard(d) {
    const main = document.getElementById('mainContent');
    const host = location.origin;
    const subscriptionUrl = d.subUrl || (d.uuid && d.token ? (host + '/sub?uuid=' + encodeURIComponent(d.uuid) + '&token=' + encodeURIComponent(d.token)) : '');
    const versionUrl     = d.verUrl || (d.uuid ? (host + '/version?uuid=' + encodeURIComponent(d.uuid)) : '');

    main.innerHTML = `
      <div class="hero">
        <h1>👋 欢迎回来，${esc(d.account || '用户')}</h1>
        <p>${esc(d.email || '')}${d.uuid ? ' · UUID: ' + esc(d.uuid.slice(0,8) + '...') : ''}</p>
      </div>

      <div class="sec-title">🌍 当前网络信息</div>
      <div class="network-cards-container">
        <div class="network-card">
          <div class="network-card-title">
            <span class="status-indicator loading" id="status-ipip"></span>
            <div class="title-text">
              <div class="title-main">国内测试</div>
              <div class="title-subtitle" id="ipip-provider">CN-Test</div>
            </div>
          </div>
          <div class="network-info-content">
            <span id="ipip-ip" class="ip-text">-</span>
            <div class="location-text"><span id="ipip-country">-</span></div>
            <div class="network-tip">· 您访问国内站点所使用的IP</div>
          </div>
        </div>

        <div class="network-card">
          <div class="network-card-title">
            <span class="status-indicator loading" id="status-overseas"></span>
            <div class="title-text">
              <div class="title-main">国外测试</div>
              <div class="title-subtitle" id="overseas-provider">漏网之鱼</div>
            </div>
          </div>
          <div class="network-info-content">
            <span id="overseas-ip" class="ip-text">-</span>
            <div class="location-text"><span id="overseas-country">-</span></div>
            <div class="network-tip">· 您访问没有被封的国外站点所使用的IP</div>
          </div>
        </div>

        <div class="network-card">
          <div class="network-card-title">
            <span class="status-indicator loading" id="status-cf"></span>
            <div class="title-text">
              <div class="title-main">CloudFlare</div>
              <div class="title-subtitle" id="cf-provider">ProxyIP</div>
            </div>
          </div>
          <div class="network-info-content">
            <span id="cf-ip" class="ip-text">-</span>
            <div class="location-text"><span id="cf-country">-</span></div>
            <div class="network-tip">· 您访问CFCDN站点所使用的落地IP</div>
          </div>
        </div>

        <div class="network-card">
          <div class="network-card-title">
            <span class="status-indicator loading" id="status-twitter"></span>
            <div class="title-text">
              <div class="title-main">墙外测试</div>
              <div class="title-subtitle" id="twitter-provider">!CN-Test</div>
            </div>
          </div>
          <div class="network-info-content">
            <span id="twitter-ip" class="ip-text">-</span>
            <div class="location-text"><span id="twitter-country">-</span></div>
            <div class="network-tip">· 您访问墙外站点所使用的IP</div>
          </div>
        </div>
      </div>

      <div class="sec-title">📊 流量用量</div>
      <div class="network-cards-container" style="grid-template-columns:repeat(3,1fr)">
        <div class="network-card" style="text-align:center">
          <div class="network-info-content">
            <span class="ip-text" id="usedTrafficValue" style="color:#16a34a">${fmtBytes(d.used_traffic||0)}</span>
            <div class="network-tip">个人已用</div>
          </div>
        </div>
        <div class="network-card" style="text-align:center">
          <div class="network-info-content">
            <span class="ip-text" id="totalTrafficValue">${d.traffic > 0 ? fmtBytes(d.traffic) : '不限'}</span>
            <div class="network-tip">个人配额</div>
          </div>
        </div>
        <div class="network-card" style="text-align:center">
          <div class="network-info-content">
            <span class="ip-text" id="onlineCount" style="color:#16a34a">--</span>
            <div class="network-tip">在线人数</div>
          </div>
        </div>
      </div>
      <div class="network-cards-container" style="grid-template-columns:repeat(2,1fr)">
        <div class="network-card" style="text-align:center">
          <div class="network-info-content">
            <span class="ip-text" id="globalDownValue" style="color:#3b82f6">--</span>
            <div class="network-tip">全站下行</div>
          </div>
        </div>
        <div class="network-card" style="text-align:center">
          <div class="network-info-content">
            <span class="ip-text" id="globalUpValue" style="color:#f59e0b">--</span>
            <div class="network-tip">全站上行</div>
          </div>
        </div>
      </div>

      <div class="sec-title">🎁 每日签到</div>
      <div class="network-card">
        <div class="network-info-content" style="gap:12px">
          <span class="ip-text" style="font-size:1.4rem;color:#f59e0b">随机领取 2-20 GB</span>
          <div class="network-tip" id="checkinMeta">每日签到可增加总流量配额</div>
          <div class="network-tip" id="checkinStatus">正在检查签到状态...</div>
          <button id="checkinBtn" type="button" style="margin-top:6px;border:none;border-radius:999px;padding:10px 18px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;font-weight:700;cursor:pointer">签到领流量</button>
        </div>
      </div>

      <div class="sec-title">🔗 订阅链接</div>
      <div class="links">
        ${subscriptionUrl ? `
        <div class="link-card">
          <span class="link-label">📋 订阅地址</span>
          <span class="link-value">${esc(subscriptionUrl)}</span>
          <button class="link-btn" data-copy="${escAttr(subscriptionUrl)}">📋 复制</button>
        </div>` : ''}
        ${d.uuid ? `
        <div class="link-card">
          <span class="link-label">🆔 用户 UUID</span>
          <span class="link-value">${esc(d.uuid)}</span>
          <button class="link-btn" data-copy="${escAttr(d.uuid)}">📋 复制</button>
        </div>` : ''}
        ${d.token ? `
        <div class="link-card">
          <span class="link-label">🔑 订阅 Token</span>
          <span class="link-value">${esc(d.token)}</span>
          <button class="link-btn" data-copy="${escAttr(d.token)}">📋 复制</button>
        </div>` : ''}
      </div>
    `;

    // update topbar
    const userLabel = document.getElementById('userLabel');
    if (userLabel && d.account) userLabel.textContent = '👤 ' + esc(d.account);

    // attach copy handlers
    main.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', () => copy(btn.dataset.copy, btn));
    });
    const checkinBtn = document.getElementById('checkinBtn');
    if (checkinBtn) checkinBtn.addEventListener('click', claimDailyCheckin);
    updateCheckinDisplay(d);

    // load network cards + global stats
    loadNetworkCards();
    fetchGlobalStats();
  }

  // ── init ──
  const stored = sessionStorage.getItem('beacon_user');
  if (stored) {
    try {
      renderDashboard(JSON.parse(stored));
      refreshUserData();
      setInterval(refreshUserData, 10000);
      setInterval(fetchGlobalStats, 10000);
    } catch(e) {
      // stay on empty state
    }
  }
})();
</script>
</body>
</html>
